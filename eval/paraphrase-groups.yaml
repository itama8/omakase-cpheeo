    source: review
    # 8.7.3.9 gives air 36-45 m/hr, water 24-40 m/hr; Annexure 8.5 prints 35-45 cum/sqm/min
    # for both (suspicious units). Either one answers the question.
    expect: [WS-2024-A:8.7.3.9, WS-2024-A:AN8.5]
    phrasings:
      - {style: short, q: "filter backwash rate"}
      - {style: short, q: "air scour rate rapid sand filter"}
      - {style: natural, q: "What air scour and water wash rates are recommended for backwashing rapid sand filters?"}
      - {style: natural, q: "How long should a rapid gravity filter be backwashed and at what wash water rate?"}
      - {style: manual, q: "air scour and high-rate backwash"}

