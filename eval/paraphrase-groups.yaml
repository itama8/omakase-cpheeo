# Paraphrase groups: several natural phrasings of one engineering question, all answered
# by the same units. Prompted by an external MCP consumer review (ChatGPT, 2026-11) that
# found search locates concepts but is inconsistent across rephrasings of one question.
#
# A group is scored on its WORST-ranked phrasing (an assistant only sees the phrasing it
# happened to write), plus hit@1 / hit@k across all phrasings:
#   uv run omakase-cpheeo eval --questions eval/paraphrase-groups.yaml -v
#
# Phrasing styles:
#   short   - a few keywords, as typed into a search box
#   manual  - uses the manual's own heading or terms
#   natural - a plain engineer's question
#   long    - a long question with qualifiers, as an assistant writes it
#   gap     - different vocabulary from the manual (synonyms, abbreviations, jargon)
#   review  - the exact phrasing reported by the review
# Phrasings were written before being run, and are not edited to make them pass.
# Every expected id was checked against the unit text on 2026-11-09 (transcribed index).
# `source: review` groups come from the review; `source: regression` worked at review time.

groups:
  # ---- Seeded from the review
  - id: P01
    target: Total head of pumping (sewage)
    source: review
    expect: [SEW-2013-A:4.7.2]
    phrasings:
      - {style: review, q: "Which components of total dynamic head must be considered when sizing a sewage pump that discharges through a rising main into a pressured receiving line?"}
      - {style: review, q: "What makes up the total head of a sewage pump: static head, velocity head, pressure head and friction losses?"}
      - {style: manual, q: "computation of the total head of pumping"}
      - {style: natural, q: "How do I calculate the pump head for a sewage pumping station?"}
      - {style: gap, q: "TDH calculation for a sewage lift station pump"}

  - id: P02
    target: Grit chambers after the pumps when sewers are deep
    source: review
    expect: [SEW-2013-A:5.6.2]
    phrasings:
      - {style: review, q: "When can a grit chamber be installed downstream of a sewage pump station rather than upstream, according to CPHEEO?"}
      - {style: short, q: "grit chamber after pumps deep sewers"}
      - {style: natural, q: "Should grit removal come before or after the pumps at a sewage treatment plant inlet?"}
      - {style: manual, q: "Where sewers are laid at great depth, can only a bar screen be provided ahead of the pumps with grit chambers following the pumps?"}
      - {style: natural, q: "Is 100% standby required for grit removal units?"}

  - id: P03
    target: Surge and water hammer in sewage pumping
    source: review
    expect: [SEW-2013-A:4.10]
    phrasings:
      - {style: short, q: "sewage pump water hammer"}
      - {style: short, q: "surge analysis sewage pumping power failure"}
      - {style: long, q: "What surge analysis is required for a sewage rising main when pumps trip during a sudden power failure, and what transient effects must be addressed?"}
      - {style: gap, q: "Does a sewage force main need a transient analysis for pump trip?"}
      - {style: manual, q: "surging of pump and water hammer"}

